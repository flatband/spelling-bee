    <script>
      // Static hosts only ever serve this file from the app's own directory, so
      // that directory is the router's basename — read it instead of hardcoding
      // one, and the same build runs at a domain root or under /<repo>/.
      (function () {
        var path = location.pathname;
        var root = path.slice(0, path.lastIndexOf('/') + 1);
        window.__APP_BASE__ = root;

        // 404.html parks the requested route in the query string (?/game) so a
        // deep link or a refresh can survive a host with no SPA rewrite rule.
        // Put it back in the address bar before React reads the URL.
        if (location.search.slice(0, 2) === '?/') {
          history.replaceState(null, '', root + location.search.slice(2) + location.hash);
        }
      })();
    </script>
